name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Docker Compose dependencies
        run: sudo apt-get update && sudo apt-get install -y docker-compose postgresql-client

      - name: Start services
        run: docker compose -f compose.yaml up -d postgres

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            docker compose -f compose.yaml exec -T postgres pg_isready -U bookmanager && exit 0
            sleep 2
          done
          echo "Postgres not ready" >&2
          docker compose -f compose.yaml logs postgres
          exit 1

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bookmanager
          SPRING_DATASOURCE_USERNAME: bookmanager
          SPRING_DATASOURCE_PASSWORD: bookmanager
        run: ./gradlew test
